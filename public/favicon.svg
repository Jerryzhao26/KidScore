<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" filter="drop-shadow(0px 8px 16px rgba(0,0,0,0.15))">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    
    <!-- Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="shieldGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Coin Gradient -->
    <linearGradient id="goldCoin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    
    <!-- Face/Helmet Gradient -->
    <linearGradient id="helmetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
  </defs>

  <!-- iOS-style Rounded Background -->
  <rect x="0" y="0" width="512" height="512" rx="104" fill="url(#bgGrad)" />

  <!-- Castle-like Subtle Silhouette Background -->
  <path d="M 80,380 L 80,260 L 110,230 L 110,260 L 140,260 L 140,230 L 170,230 L 170,380 Z" fill="#1e40af" opacity="0.3" />
  <path d="M 340,380 L 340,240 L 370,210 L 370,240 L 400,240 L 400,210 L 430,210 L 430,380 Z" fill="#1e40af" opacity="0.3" />

  <!-- Floating Tiny Coins -->
  <circle cx="80" cy="180" r="18" fill="#fef08a" opacity="0.8" stroke="#ca8a04" stroke-width="2" />
  <circle cx="440" cy="150" r="22" fill="#fef08a" opacity="0.8" stroke="#ca8a04" stroke-width="2" />

  <!-- The Sword (Diagonal behind the shield) -->
  <g transform="translate(180, 160) rotate(-35)">
    <rect x="-8" y="-90" width="16" height="120" rx="4" fill="#cbd5e1" stroke="#475569" stroke-width="4" />
    <!-- Blue handle ribbon -->
    <path d="M -8,-90 L 0,-105 L 8,-90 Z" fill="#ef4444" />
    <!-- Guard -->
    <rect x="-24" y="30" width="48" height="12" rx="3" fill="#b45309" stroke="#78350f" stroke-width="4" />
    <!-- Grip -->
    <rect x="-6" y="42" width="12" height="35" rx="2" fill="#78350f" />
    <!-- Pommel -->
    <circle cx="0" cy="82" r="10" fill="#cbd5e1" stroke="#475569" stroke-width="4" />
  </g>

  <!-- Giant Shining Coin at Bottom as Stand -->
  <g transform="translate(256, 395)">
    <ellipse cx="0" cy="0" rx="190" ry="105" fill="url(#goldCoin)" stroke="#f59e0b" stroke-width="8" />
    <ellipse cx="0" cy="0" rx="160" ry="85" fill="none" stroke="#fef08a" stroke-width="4" stroke-dasharray="8 6" />
    <!-- "100 pts" text on golden coin -->
    <text x="0" y="22" font-family="'Inter', system-ui, sans-serif" font-weight="900" font-size="56" fill="#78350f" text-anchor="middle" letter-spacing="-1">100 pts</text>
  </g>

  <!-- Knight's Shield (Centered) -->
  <g transform="translate(256, 225)">
    <!-- Base outer shield -->
    <path d="M -90,-110 C -90,-110 0,-120 0,-120 C 0,-120 90,-110 90,-110 C 90,-110 95,20 0,110 C -95,20 -90,-110 -90,-110 Z" fill="url(#shieldGoldGrad)" stroke="#78350f" stroke-width="8" />
    <!-- Inner shield plate -->
    <path d="M -72,-94 C -72,-94 0,-103 0,-103 C 0,-103 72,-94 72,-94 C 72,-94 76,15 0,90 C -76,15 -72,-94 -72,-94 Z" fill="url(#shieldGrad)" />
    
    <!-- Paw Imprint (Shield Emblem) -->
    <g transform="translate(0, -10)" fill="#b45309">
      <!-- Main Pad -->
      <path d="M -25,12 C -25,0 -15,-10 0,-10 C 15,-10 25,0 25,12 C 25,25 15,30 0,30 C -15,30 -25,25 -25,12 Z" />
      <!-- Left Toe -->
      <circle cx="-28" cy="-8" r="8" />
      <!-- Center-Left Toe -->
      <circle cx="-11" cy="-22" r="9" />
      <!-- Center-Right Toe -->
      <circle cx="11" cy="-22" r="9" />
      <!-- Right Toe -->
      <circle cx="28" cy="-8" r="8" />
    </g>
  </g>

  <!-- Cute Eyes Over Shield (Peek-a-boo Warrior style) -->
  <g transform="translate(256, 110)">
    <!-- Helmet top -->
    <path d="M -60,0 C -60,-65 60,-65 60,0 Z" fill="url(#helmetGrad)" stroke="#1e293b" stroke-width="6" />
    <!-- Red feather plume on top of helmet -->
    <path d="M 0,-55 C 0,-95 -40,-110 -20,-125 C -5,-115 15,-95 5,-55 Z" fill="#ef4444" />
    <!-- Headband / brow of helmet -->
    <rect x="-66" y="-6" width="132" height="15" rx="4" fill="#cbd5e1" stroke="#1e293b" stroke-width="4" />
    <!-- Cheek guards -->
    <path d="M -60,8 L -50,30 L -30,12 Z" fill="url(#helmetGrad)" stroke="#1e293b" stroke-width="4" />
    <path d="M 60,8 L 50,30 L 30,12 Z" fill="url(#helmetGrad)" stroke="#1e293b" stroke-width="4" />
    <!-- Friendly Animating Eyes -->
    <circle cx="-22" cy="18" r="8" fill="#1e293b" />
    <circle cx="-24" cy="15" r="2.5" fill="#ffffff" />
    <circle cx="22" cy="18" r="8" fill="#1e293b" />
    <circle cx="20" cy="15" r="2.5" fill="#ffffff" />
    
    <!-- Blush cheeks -->
    <ellipse cx="-40" cy="26" rx="10" ry="5" fill="#f87171" opacity="0.6" />
    <ellipse cx="40" cy="26" rx="10" ry="5" fill="#f87171" opacity="0.6" />
  </g>

  <!-- Sparkle Stars -->
  <g transform="translate(140, 100)" fill="#fef08a" opacity="0.9">
    <path d="M 0,-15 L 4,-4 L 15,0 L 4,4 L 0,15 L -4,4 L -15,0 L -4,-4 Z" />
  </g>
  <g transform="translate(390, 280)" fill="#fef08a" opacity="0.9">
    <path d="M 0,-20 L 5,-5 L 20,0 L 5,5 L 0,20 L -5,5 L -20,0 L -5,-5 Z" />
  </g>
</svg>
